[project]
name = "traider"
version = "0.1.0"
description = "Rule-based trading bot for a Schwab brokerage account, run on AWS Fargate and deployed with Pulumi"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.14,<4",
    "anthropic[bedrock]>=1.13,<2",
    "boto3>=1.43,<2",
    "pydantic>=2.14,<3",
    "tzdata>=2026.1",
]

[project.scripts]
traider = "traider.cli:main"

[dependency-groups]
dev = [
    "moto[dynamodb,secretsmanager,sns,ssm]>=5",
    "mypy>=2.4",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "C4", "RET", "PL"]
ignore = [
    "PLR0911", # many returns: guard-clause style is deliberate in risk checks
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004", # magic values in tests and HTTP status checks
    "S101",    # assert is used in tests
]

[tool.ruff.lint.per-file-ignores]
# Tests favour readable scenarios over these style rules.
"tests/**" = [
    "ASYNC109", # helper coroutines take a timeout argument
    "ASYNC110",
    "ASYNC230",
    "PLC0415",  # imports next to the one test that needs them
    "PLR0917",
    "PT011",
    "PT018",
    "S105",
    "S106",
    "S107",
    "S108",
    "S311",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src/traider"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
