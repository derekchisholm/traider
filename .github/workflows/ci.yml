name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32" # the version that wrote uv.lock; keep in step with the Dockerfile

jobs:
  bot:
    name: Bot (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The tests use a fake Schwab server and a fake AWS. They need no credentials.
      - run: uv run pytest

  infra:
    name: Infrastructure (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Runs the Pulumi program against mocks: no AWS account and no Pulumi CLI needed.
      - run: uv run pytest

  image:
    name: Container image (build for ARM, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image Fargate will run
        run: docker buildx build --platform linux/arm64 --load --tag traider:ci .
      - name: The command line starts
        run: docker run --rm --platform linux/arm64 traider:ci --help
      - name: It does not run as root
        run: test "$(docker run --rm --platform linux/arm64 --entrypoint id traider:ci -u)" = "10001"
      - name: The health check fails until the bot's loop is turning
        run: |
          if docker run --rm --platform linux/arm64 --entrypoint python traider:ci -m traider.health; then
            echo "health check passed with no bot running" >&2
            exit 1
          fi
